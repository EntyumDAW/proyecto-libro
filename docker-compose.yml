version: '3.8'
services:
  postgres:
    container_name: db-libro
    ports:
     - "5432:5432"
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./docker_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}'"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s
  backend:
    build: ./backend
    container_name: backend_libro
    ports: 
      - "4000:4000"
    command: bash -c "npx prisma db push && npm start"
    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}"
      PORT: "${BACKEND_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: frontend_libro
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy